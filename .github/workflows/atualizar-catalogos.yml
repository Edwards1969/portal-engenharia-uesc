name: Atualizar catalogos didaticos

on:
  push:
    branches:
      - main
      - reformulacao-cet990
    paths:
      - 'CET*/AULAS/**'
      - 'CET*/EXERCICIOS/**'
      - 'CET*/SLIDES/**'
      - 'CET*/VIDEOS/**'
      - 'scripts/gerar_catalogos.py'
      - '!**/catalogo.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-catalogos:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar catalogos
        run: python scripts/gerar_catalogos.py
      - name: Registrar catalogos alterados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'CET*/**/catalogo.json'
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catalogos de materiais automaticamente"
            git push
          fi
