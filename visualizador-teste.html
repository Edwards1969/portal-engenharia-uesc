
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Visualizador de Materiais | Engenharia UESC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fb;
      color: #263747;
    }

    header {
      background: #123b61;
      color: white;
      padding: 16px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .barra {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .botao {
      display: inline-block;
      padding: 11px 15px;
      background: #123b61;
      color: white;
      border-radius: 7px;
      text-decoration: none;
      font-size: 14px;
    }

    .botao.secundario {
      background: #e8eef4;
      color: #123b61;
    }

    main {
      padding: 14px;
    }

    #titulo {
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    #documento {
      width: 100%;
      height: 75vh;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    .mensagem {
      background: white;
      padding: 25px;
      border-radius: 8px;
      line-height: 1.6;
    }

    #paginas-pdf {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pagina-pdf {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 1px 5px #0002;
    }

    .pagina-container {
      width: 100%;
      max-width: 900px;
      background: white;
    }

    .pagina-erro {
      padding: 20px;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      header {
        padding: 12px 14px;
      }

      header h1 {
        font-size: 16px;
      }

      .barra {
        padding: 8px 12px;
      }

      .botao {
        padding: 10px 12px;
        font-size: 13px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }

      .botao.secundario {
        display: none;
      }

      main {
        padding: 8px;
      }

      #titulo {
        font-size: 16px;
        margin: 12px 4px;
      }

      #paginas-pdf {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Engenharia UESC | Materiais Didáticos</h1>
</header>

<nav class="barra" aria-label="Navegação do material">
  <a id="voltar" class="botao" href="index.html">
    ← Voltar à disciplina
  </a>

  <a id="abrir" class="botao secundario"
     href="index.html" target="_blank"
     rel="noopener noreferrer" hidden>
    Abrir documento externamente
  </a>
</nav>

<main>
  <h2 id="titulo">Material didático</h2>

  <div id="conteudo" class="mensagem">
    Preparando o documento...
  </div>
</main>

<script type="module">
  const parametros = new URLSearchParams(location.search);

  const arquivo = parametros.get("arquivo");
  const retorno = parametros.get("retorno");
  const titulo = parametros.get("titulo") || "Material didático";

  const tituloElemento = document.getElementById("titulo");
  const conteudo = document.getElementById("conteudo");
  const botaoVoltar = document.getElementById("voltar");
  const botaoAbrir = document.getElementById("abrir");

  tituloElemento.textContent = titulo;

  const raizPortal = new URL("./", location.href);

  function enderecoSeguro(valor, permitirGitHub = false) {
    if (!valor) return null;

    try {
      const url = new URL(valor, raizPortal);

      if (url.protocol !== "https:" &&
          url.protocol !== "http:") {
        return null;
      }

      if (url.origin === raizPortal.origin &&
          url.pathname.startsWith(raizPortal.pathname)) {
        return url;
      }

      if (permitirGitHub &&
          url.protocol === "https:" &&
          url.hostname === "github.com" &&
          url.pathname.startsWith(
            "/Edwards1969/portal-engenharia-uesc/")) {
        return url;
      }

      return null;
    } catch {
      return null;
    }
  }

  const destinoRetorno = enderecoSeguro(retorno);
  botaoVoltar.href = destinoRetorno
    ? destinoRetorno.href
    : raizPortal.href;

  const destinoArquivo = enderecoSeguro(arquivo, true);

  if (!destinoArquivo) {
    conteudo.textContent =
      "Documento não informado ou endereço inválido.";
  } else {
    botaoAbrir.href = destinoArquivo.href;
    botaoAbrir.hidden = false;

    const extensao = destinoArquivo.pathname
      .split(".").pop().toLowerCase();

    if (extensao === "pdf" &&
        destinoArquivo.origin === raizPortal.origin) {

      const celular = window.matchMedia(
        "(max-width: 700px)"
      ).matches;

      if (!celular) {
        const iframe = document.createElement("iframe");
        iframe.id = "documento";
        iframe.title = titulo;
        iframe.src = destinoArquivo.href;

        conteudo.replaceWith(iframe);
      } else {
        const paginas = document.createElement("div");
        paginas.id = "paginas-pdf";
        paginas.setAttribute("aria-label", titulo);
        conteudo.replaceWith(paginas);

        try {
          const pdfjsLib = await import(
            "./pdfjs/pdf.mjs"
          );

          pdfjsLib.GlobalWorkerOptions.workerSrc =
            new URL("./pdfjs/pdf.worker.mjs", import.meta.url).href;

          const tarefa = pdfjsLib.getDocument({
            url: destinoArquivo.href
          });

          const pdf = await tarefa.promise;

          const observador = new IntersectionObserver(
            async entradas => {
              for (const entrada of entradas) {
                if (!entrada.isIntersecting) continue;

                const elemento = entrada.target;
                observador.unobserve(elemento);

                const numero = Number(elemento.dataset.pagina);

                try {
                  const pagina = await pdf.getPage(numero);

                  const largura = Math.max(
                    1,
                    elemento.clientWidth
                  );

                  const viewportBase = pagina.getViewport({
                    scale: 1
                  });

                  const escala = largura / viewportBase.width;

                  const viewport = pagina.getViewport({
                    scale: escala
                  });

                  const canvas = document.createElement("canvas");
                  canvas.className = "pagina-pdf";

                  const contexto = canvas.getContext("2d");

                  const proporcao = Math.min(
                    window.devicePixelRatio || 1,
                    2
                  );

                  canvas.width = Math.floor(
                    viewport.width * proporcao
                  );

                  canvas.height = Math.floor(
                    viewport.height * proporcao
                  );

                  canvas.style.width = "100%";

                  await pagina.render({
                    canvasContext: contexto,
                    viewport,
                    transform: proporcao !== 1
                      ? [proporcao, 0, 0, proporcao, 0, 0]
                      : null
                  }).promise;

                  elemento.appendChild(canvas);

                } catch (erro) {
                  console.error(erro);
                  elemento.textContent =
                    "Não foi possível apresentar esta página.";
                  elemento.classList.add("pagina-erro");
                }
              }
            },
            {
              rootMargin: "600px 0px",
              threshold: 0
            }
          );

          for (let numero = 1; numero <= pdf.numPages; numero++) {
            const pagina = document.createElement("div");
            pagina.className = "pagina-container";
            pagina.dataset.pagina = numero;

            pagina.style.minHeight = "400px";

            paginas.appendChild(pagina);
            observador.observe(pagina);
          }

        } catch (erro) {
          console.error(erro);
          paginas.textContent =
            "Não foi possível carregar o PDF. " +
            "Verifique a conexão ou tente abrir " +
            "o documento externamente.";
        }
      }

    } else {
      conteudo.innerHTML = "";

      const mensagem = document.createElement("p");
      mensagem.textContent =
        "Este material pode ser consultado pelo botão " +
        "'Abrir documento externamente'. " +
        "A página do Portal permanecerá disponível " +
        "para seu retorno.";

      conteudo.appendChild(mensagem);
    }
  }
</script>

</body>
</html>
