
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Visualizador de Materiais | Engenharia UESC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
	  width: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:  white;
      color: #263747;
    }

    header {
      background: #123b61;
      color: white;
      padding: 16px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

	.titulo-computador {
    display: inline;
	}

	.titulo-celular {
		display: none;
	}

    .barra {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .botao {
      display: inline-block;
      padding: 11px 15px;
      background: #123b61;
      color: white;
      border-radius: 7px;
      text-decoration: none;
      font-size: 14px;
    }

    .botao.secundario {
      background: #e8eef4;
      color: #123b61;
    }

    main {
      padding: 14px;
    }

    #titulo {
      font-size: 18px;
      overflow-wrap: anywhere;
	  display: none;
    }

    #documento {
      width: 100%;
      height: 85vh;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    .mensagem {
      background: white;
      padding: 25px;
      border-radius: 8px;
      line-height: 1.6;
    }

    #paginas-pdf {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
	  transform-origin: top left;
    }

#area-leitura-pdf {
    width: 100%;
    min-width: 0;
    overflow-x: auto;
	overflow-y: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
	touch-action: pan-x pan-y;
	}

#espaco-zoom-pdf {
	position: relative;
	width: 100%;
	min-width: 0;
	}

/* Área de leitura e ampliação do PDF no celular */

    .pagina-pdf {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 1px 5px #0002;
    }

    .pagina-container {
      width: 100%;
      max-width: none;
	  margin-left: auto;
	 margin-right: auto;
      background: white;
	  flex-shrink: 0;
    }

    .pagina-erro {
      padding: 20px;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      header {
        padding: 12px 14px;
      }

      header h1 {
        font-size: 16px;
      }

      .barra {
        padding: 8px 12px;
      }

      .botao {
        padding: 10px 12px;
        font-size: 13px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
      }

      .botao.secundario {
        display: none;
      }

      main {
        padding: 8px;
      }

      #titulo {
        font-size: 16px;
        margin: 12px 4px;
      }

      #paginas-pdf {
        gap: 8px;
      }
    }

/* Navegação compacta para celulares */

.botao-voltar-mobile {
  display: none;
}

@media (hover: none) and (pointer: coarse), (max-width: 1100px) and (pointer: coarse) {

main {
    padding-left: 0;
    padding-right: 0;
}

header {
	position: sticky;
	top: 0;
	z-index: 1000;
	padding: 10px 12px;
}

  .cabecalho-conteudo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.titulo-celular small {
  display: block;
  font-size: 12px;
  font-weight: normal;
  margin-top: 3px;
}

.titulo-computador {
  display: none;
}

.titulo-celular {
  display: block;
}

  header h1 {
    font-size: 14px;
    line-height: 1.3;
    flex: 1;
    min-width: 0;
  }

  .botao-voltar-mobile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    min-height: 40px;
    padding: 8px 10px;
    background: white;
    color: #123b61;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    text-decoration: none;
    white-space: nowrap;
  }
  .barra {
    display: none;
  }
}
  </style>
</head>

<body>

<header>
  <div class="cabecalho-conteudo">
    <h1>
      <span class="titulo-computador">
        Engenharia UESC | Materiais Didáticos
      </span>

      <span class="titulo-celular">
        Engenharia UESC
        <small>Materiais Didáticos</small>
      </span>
    </h1>

    <a id="voltar-mobile"
       class="botao-voltar-mobile"
       href="index.html">
      ← Voltar à disciplina
    </a>
  </div>
</header>


<nav class="barra" aria-label="Navegação do material">
  <a id="voltar" class="botao" href="index.html">
    ← Voltar à disciplina
  </a>

  <a id="abrir" class="botao secundario"
     href="index.html" target="_blank"
     rel="noopener noreferrer" hidden>
    Abrir documento externamente
  </a>
</nav>

<main>
  <h2 id="titulo">Material didático</h2>

  <div id="conteudo" class="mensagem">
    Preparando o documento...
  </div>
</main>

<script type="module">
  const parametros = new URLSearchParams(location.search);

  const arquivo = parametros.get("arquivo");
  const retorno = parametros.get("retorno");
  const titulo = parametros.get("titulo") || "Material didático";

  const tituloElemento = document.getElementById("titulo");
  const conteudo = document.getElementById("conteudo");
  const botaoVoltar = document.getElementById("voltar");
  const botaoAbrir = document.getElementById("abrir");
  const botaoVoltarMobile =
  document.getElementById("voltar-mobile");

  tituloElemento.textContent = titulo;

  const raizPortal = new URL("./", location.href);

  function enderecoSeguro(valor, permitirGitHub = false) {
    if (!valor) return null;

    try {
      const url = new URL(valor, raizPortal);

      if (url.protocol !== "https:" &&
          url.protocol !== "http:") {
        return null;
      }

      if (url.origin === raizPortal.origin &&
          url.pathname.startsWith(raizPortal.pathname)) {
        return url;
      }

      if (permitirGitHub &&
          url.protocol === "https:" &&
          url.hostname === "github.com" &&
          url.pathname.startsWith(
            "/Edwards1969/portal-engenharia-uesc/")) {
        return url;
      }

      return null;
    } catch {
      return null;
    }
  }

  const destinoRetorno = enderecoSeguro(retorno);
  botaoVoltar.href = destinoRetorno
    ? destinoRetorno.href
    : raizPortal.href;
	botaoVoltarMobile.href = botaoVoltar.href;

  const destinoArquivo = enderecoSeguro(arquivo, true);

  if (!destinoArquivo) {
    conteudo.textContent =
      "Documento não informado ou endereço inválido.";
  } else {
    botaoAbrir.href = destinoArquivo.href;
    botaoAbrir.hidden = false;

    const extensao = destinoArquivo.pathname
      .split(".").pop().toLowerCase();

    if (extensao === "pdf" &&
        destinoArquivo.origin === raizPortal.origin) {

    	const celular = window.matchMedia(
		"(hover: none) and (pointer: coarse), (max-width: 1100px) and (pointer: coarse)"
		).matches;

      if (!celular) {
        const iframe = document.createElement("iframe");
        iframe.id = "documento";
        iframe.title = titulo;
        iframe.src = destinoArquivo.href;

        conteudo.replaceWith(iframe);
      } else {
        const paginas = document.createElement("div");
        paginas.id = "paginas-pdf";
        paginas.setAttribute("aria-label", titulo);
        const areaLeitura = document.createElement("div");
		areaLeitura.id = "area-leitura-pdf";

		const espacoZoom = document.createElement("div");
		espacoZoom.id = "espaco-zoom-pdf";

		espacoZoom.appendChild(paginas);
		areaLeitura.appendChild(espacoZoom);
		conteudo.replaceWith(areaLeitura);

		paginas.style.width = "100%";

		let fatorZoom = 1;

		const zoomMinimo = 1;
		const zoomMaximo = 3;

		let larguraBasePDF = areaLeitura.clientWidth;

		function atualizarEspacoZoom() {
			const alturaOriginal = paginas.offsetHeight;

			espacoZoom.style.width =
				`${larguraBasePDF * fatorZoom}px`;

			espacoZoom.style.height =
				`${alturaOriginal * fatorZoom}px`;
		}

		const observadorTamanho = new ResizeObserver(() => {
			atualizarEspacoZoom();
		});

		observadorTamanho.observe(paginas);

		window.addEventListener("resize", () => {
			larguraBasePDF = areaLeitura.clientWidth;

			paginas.style.width = `${larguraBasePDF}px`;

			atualizarEspacoZoom();
	});

		function distanciaEntreToques(toque1, toque2) {
  		  const dx = toque2.clientX - toque1.clientX;
   		  const dy = toque2.clientY - toque1.clientY;

    	  return Math.hypot(dx, dy);
        }

		let distanciaInicial = 0;
		let zoomInicial = 1;

		let centroInicialX = 0;
		let centroInicialY = 0;

		areaLeitura.addEventListener("touchstart", (evento) => {
			if (evento.touches.length === 2) {
				distanciaInicial = distanciaEntreToques(
					evento.touches[0],
					evento.touches[1]
				);

				centroInicialX = (
					evento.touches[0].clientX +
					evento.touches[1].clientX
				) / 2;

				centroInicialY = (
					evento.touches[0].clientY +
					evento.touches[1].clientY
				) / 2;
				zoomInicial = fatorZoom;
			}

			}, { passive: true });

		areaLeitura.addEventListener("touchmove", (evento) => {

			if (evento.touches.length === 2) {
				evento.preventDefault();
			}

			if (evento.touches.length !== 2 || distanciaInicial <= 0) {
				return;
			}

			const distanciaAtual = distanciaEntreToques(
				evento.touches[0],
				evento.touches[1]
			);

			const sensibilidadeZoom = 0.3;

			const proporcaoZoom = distanciaAtual / distanciaInicial;

			const novoZoom = zoomInicial *
				Math.pow(proporcaoZoom, sensibilidadeZoom);

			const zoomAnterior = fatorZoom;

			fatorZoom = Math.max(
				zoomMinimo,
				Math.min(zoomMaximo, novoZoom)
			);

			const centroAtualX = (
				evento.touches[0].clientX +
				evento.touches[1].clientX
			) / 2;

			const centroAtualY = (
				evento.touches[0].clientY +
				evento.touches[1].clientY
			) / 2;

			const proporcaoEscala = fatorZoom / zoomAnterior;

			const retanguloLeitura = areaLeitura.getBoundingClientRect();

			const pontoX = centroAtualX - retanguloLeitura.left;
			const pontoY = centroAtualY - retanguloLeitura.top;

			paginas.style.transformOrigin = "center top";
			paginas.style.transform = `scale(${fatorZoom})`;
			
			paginas.style.width = `${larguraBasePDF}px`;
			atualizarEspacoZoom();

//		areaLeitura.scrollLeft =
//			(areaLeitura.scrollLeft + pontoX) * proporcaoEscala - pontoX;

//		areaLeitura.scrollTop =
//			(areaLeitura.scrollTop + pontoY) * proporcaoEscala - pontoY;

 		}, { passive: false });

		areaLeitura.addEventListener("touchend", (evento) => {
			if (evento.touches.length < 2) {
				distanciaInicial = 0;
			}
		}, { passive: true });

		areaLeitura.addEventListener("touchcancel", () => {
			distanciaInicial = 0;
		}, { passive: true });

        try {
          const pdfjsLib = await import(
            "./pdfjs/pdf.mjs"
          );

          pdfjsLib.GlobalWorkerOptions.workerSrc =
            new URL("./pdfjs/pdf.worker.mjs", import.meta.url).href;

          const tarefa = pdfjsLib.getDocument({
            url: destinoArquivo.href
          });

          const pdf = await tarefa.promise;

          const observador = new IntersectionObserver(
            async entradas => {
              for (const entrada of entradas) {
                if (!entrada.isIntersecting) continue;

                const elemento = entrada.target;
                observador.unobserve(elemento);

                const numero = Number(elemento.dataset.pagina);

                try {
                  const pagina = await pdf.getPage(numero);

                  const largura = Math.max(
                    1,
                    elemento.clientWidth
                  );

                  const viewportBase = pagina.getViewport({
                    scale: 1
                  });

                  const escala = largura / viewportBase.width;

                  const viewport = pagina.getViewport({
                    scale: escala
                  });

                  const canvas = document.createElement("canvas");
                  canvas.className = "pagina-pdf";

                  const contexto = canvas.getContext("2d");

                  const proporcao = Math.min(
                    window.devicePixelRatio || 1,
                    2
                  );

                  canvas.width = Math.floor(
                    viewport.width * proporcao
                  );

                  canvas.height = Math.floor(
                    viewport.height * proporcao
                  );

                  canvas.style.width = "100%";
				  canvas.style.height = "auto";

                  await pagina.render({
                    canvasContext: contexto,
                    viewport,
                    transform: proporcao !== 1
                      ? [proporcao, 0, 0, proporcao, 0, 0]
                      : null
                  }).promise;

                  elemento.appendChild(canvas);

				  atualizarEspacoZoom();

                } catch (erro) {
                  console.error(erro);
                  elemento.textContent =
                    "Não foi possível apresentar esta página.";
                  elemento.classList.add("pagina-erro");
                }
              }
            },
            {
              rootMargin: "600px 0px",
              threshold: 0
            }
          );

          for (let numero = 1; numero <= pdf.numPages; numero++) {
            const pagina = document.createElement("div");
            pagina.className = "pagina-container";
            pagina.dataset.pagina = numero;

            pagina.style.minHeight = "400px";

            paginas.appendChild(pagina);
            observador.observe(pagina);
          }

		atualizarEspacoZoom();

        } catch (erro) {
          console.error(erro);
          paginas.textContent =
            "Não foi possível carregar o PDF. " +
            "Verifique a conexão ou tente abrir " +
            "o documento externamente.";
        }
      }

    } else {
      conteudo.innerHTML = "";

      const mensagem = document.createElement("p");
      mensagem.textContent =
        "Este material pode ser consultado pelo botão " +
        "'Abrir documento externamente'. " +
        "A página do Portal permanecerá disponível " +
        "para seu retorno.";

      conteudo.appendChild(mensagem);
    }
  }
</script>

</body>
</html>
